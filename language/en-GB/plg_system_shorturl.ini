PLG_SYSTEM_SHORTURL_HELP_TAB="Help"
PLG_SYSTEM_SHORTURL_HELP="<h4>🔗 How to Use</h4><ol><li><b>Auto-generation:</b> Create or edit an article. After saving, a short URL is generated automatically.</li><li><b>Display:</b> The short URL appears at the top of the edit form and in a system message after saving.</li><li><b>Redirect:</b> Visitors going to <code>yoursite.com/?s=CODE</code> are redirected to the original article.</li><li><b>Existing articles:</b> If an article was created before the plugin was installed, just open it for editing — the short URL is generated automatically.</li></ol><h4>⚙️ Settings</h4><ul><li><b>Prefix:</b> Optional prefix for the short code. Leave empty for a fully random code.</li><li><b>Code length:</b> Total character count including the prefix. E.g. prefix \"ab\" + length 6 = 4 random chars.</li><li><b>Character set:</b> Letters, numbers, or both.</li></ul><div class=\"alert alert-info\"><b>💡 Note:</b> The short code is generated once and does not change on subsequent saves.</div>"

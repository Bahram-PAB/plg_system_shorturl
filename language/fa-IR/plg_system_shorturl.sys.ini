PLG_SYSTEM_SHORTURL_HELP="<h4>🔗 نحوه استفاده</h4><ol><li><b>ایجاد خودکار:</b> مطلب را ایجاد یا ویرایش کنید. پس از ذخیره، لینک کوتاه به صورت خودکار ایجاد می‌شود.</li><li><b>نمایش:</b> لینک کوتاه در بالای فرم ویرایش مطلب و در پیام سیستم پس از ذخیره نمایش داده می‌شود.</li><li><b>ریدایرکت:</b> کاربران با بازدید از <code>yoursite.com/?s=کد</code> به مطلب اصلی هدایت می‌شوند.</li><li><b>مطالب موجود:</b> اگر مطلبی قبلاً ذخیره شده و لینک کوتاه ندارد، کافیست آن را باز کنید — لینک خودکار ایجاد می‌شود.</li></ol><h4>⚙️ تنظیمات</h4><ul><li><b>پیشوند:</b> کد اختیاری در ابتدای لینک. خالی = کد تصادفی خالص.</li><li><b>طول کد:</b> تعداد کل کاراکترها شامل پیشوند. مثلاً پیشوند «ab» + طول ۶ = ۴ کاراکتر تصادفی.</li><li><b>نوع کاراکتر:</b> حروف، اعداد، یا هر دو.</li></ul><div class=\"alert alert-info\"><b>💡 نکته:</b> لینک کوتاه یک‌بار ایجاد شده و با هر بار ذخیره مطلب تغییر نمی‌کند.</div>"
